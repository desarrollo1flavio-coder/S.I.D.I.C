[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sidic"
version = "1.0.0"
description = "Sistema de Información Delictual e Inteligencia Criminal"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "S.I.D.I.C Team"}
]
keywords = ["crime", "analysis", "gis", "shapefile", "reports", "statistics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "Intended Audience :: Law Enforcement",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Office/Business :: Office Suites",
]

dependencies = [
    "PyQt6>=6.4.0",
    "pandas>=2.0.0",
    "geopandas>=0.14.0",
    "pyshp>=2.3.0",
    "shapely>=2.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "openpyxl>=3.1.0",
    "xlsxwriter>=3.1.0",
    "python-docx>=1.0.0",
    "docx2pdf>=0.1.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-qt>=4.2.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
    "flake8>=6.0.0",
]
build = [
    "pyinstaller>=5.13.0",
]

[project.urls]
Homepage = "https://github.com/tu-usuario/sidic"
Documentation = "https://github.com/tu-usuario/sidic#readme"
Repository = "https://github.com/tu-usuario/sidic.git"
Issues = "https://github.com/tu-usuario/sidic/issues"

[project.scripts]
sidic = "src.main:main"
sidic-cli = "src.main:main_cli"

[project.gui-scripts]
sidic-gui = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "config*"]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
